// Fixture for the Angular backward-compatibility check (tests/angular-compat). It exercises every
// shape of generated code the ONDEWO clients ship: unary + server-streaming RPCs (a client-streaming
// one is omitted by the image), proto3 explicit presence, enums (also packed repeated), oneofs, maps,
// nested and well-known-type messages.
syntax = "proto3";

package ondewo.compat;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_FULL = 1;
}

message Item {
  string name = 1;
  optional bool enabled = 2;
  optional int32 count = 3;
  Mode mode = 4;
  map<string, string> labels = 5;
  google.protobuf.Timestamp created = 6;
  google.protobuf.Struct payload = 7;
  oneof source {
    string url = 8;
    bytes data = 9;
  }
  message Part {
    repeated string values = 1;
  }
  repeated Part parts = 10;
  // packed on the wire (proto3 default): the generated reader must use a google-protobuf 3.21.x API
  repeated Mode modes = 11;
}

service Compat {
  rpc GetItem (Item) returns (Item);
  rpc Ping (google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc WatchItems (Item) returns (stream Item);
  rpc UploadItems (stream Item) returns (Item);
}
