# Generated by the ondewo-rust-proto-compiler from its default crate manifest template.
# Mount your own Cargo.toml in the input volume to publish under a client-specific name.
[package]
name = "ondewo-proto-stubs"
version = "5.14.0"
edition = "2021"
rust-version = "1.88"
description = "gRPC client stubs generated from ONDEWO protocol buffer definitions"
authors = ["ONDEWO GmbH <office@ondewo.com>"]
license = "Apache-2.0"
repository = "https://github.com/ondewo/ondewo-proto-compiler"

[lib]
path = "src/lib.rs"

[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
# Since tonic 0.14 the prost codec lives in its own crate and protoc-gen-tonic emits
# `tonic_prost::ProstCodec`; without tonic-prost every generated service fails to resolve.
tonic-prost = "0.14"
