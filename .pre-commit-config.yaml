#############################################################################################
# pre-commit — language-agnostic hooks for this non-python repo. The proto-compiler ships   #
# js/ts/nodejs/angular client generators; language-specific linting/formatting stays with    #
# each toolchain (eslint/prettier, buf, shellcheck via `make lint` + the bats suite/CI).      #
# Ruff/mypy/uv are python-only and NOT included here.                                        #
# see https://pre-commit.com/#intro for an introduction to pre-commit                        #
#############################################################################################

# Never touch generated / vendored code. tests/fixtures/ holds frozen test data — copies of
# client repos plus deliberately malformed inputs (e.g. corrupt/**/package.json used by the
# bats failure-path cases) that formatters/validators must never rewrite. node_modules/lib/
# dist/build are generated client output (gitignored, guarded here for safety).
exclude: '(^|/)(node_modules|lib|dist|build|\.venv)/|^tests/fixtures/'

fail_fast: false
# "fail_fast: false" means pre-commit continues to run hooks after the first failure

repos:

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [ --maxkb=1024 ]
      - id: check-json          # validate (does NOT reformat) json/package.json
      - id: check-yaml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # ORDER MATTERS - all three hooks below run at the commit-msg stage, and pre-commit runs
  # them in declaration order on the SAME message file.
  #   1. strip-ticket-prefix removes a `[OND211-2418] ` that a PREVIOUS run added, so an
  #      amend/reword validates the developer's own subject instead of the decorated one,
  #      and so the ticket cannot be prepended twice.
  #   2. conventional-pre-commit anchors at ^ and must judge that bare subject.
  #   3. giticket then prepends the ticket read from the branch name.
  # Swapping any of the three breaks commits on ticket branches - see .hooks/strip-ticket-prefix.py.
  - repo: local
    hooks:
      - id: strip-ticket-prefix
        name: strip a previously applied [TICKET] prefix
        entry: .hooks/strip-ticket-prefix.py
        language: python
        stages: [ commit-msg ]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]

  - repo: https://github.com/milin/giticket
    rev: '1.92'
    hooks:
      - id: giticket
        args: [ '--regex=(?:(?:feature|bugfix|support|hotfix)/)?(OND[0-9]{3}-[0-9]{1,5})[_-][\w-]+',
                '--format=[{ticket}] {commit_msg}',
                '--mode=regex_match' ]
